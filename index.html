<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumière Photography Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script>

<style>
/* ---------------------------------------------------------------
   Design plan
   Layout: full-bleed editorial sections, 1200px content column,
   generous vertical rhythm; portrait-oriented masonry for the
   portfolio; overlapping duotone frames in About.
----------------------------------------------------------------- */
:root{
  --bg:#faf9f7; --bg-raised:#ffffff; --fg:#171410; --mut:#6b645a;
  --line:#e7e2da; --accent:#a9742c; --accent-soft:#f1e3cc;
  --dark-bg:#121011; --dark-fg:#f3efe8;
  --display:'Playfair Display', Georgia, 'Times New Roman', serif;
  --body:'Inter', -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121011; --bg-raised:#1a1715; --fg:#f3efe8; --mut:#a79e91;
    --line:#2d2823; --accent:#d9a84f; --accent-soft:#2a2218;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121011; --bg-raised:#1a1715; --fg:#f3efe8; --mut:#a79e91;
  --line:#2d2823; --accent:#d9a84f; --accent-soft:#2a2218;
  color-scheme: dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding-inline:5vw}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--body);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600}
.lede{color:var(--mut);font-size:1.05rem;max-width:40em}
a{color:inherit}
button{font-family:var(--body);cursor:pointer}
::selection{background:var(--accent-soft);color:var(--fg)}

/* Nav */
.nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;transition:background .35s ease,border-color .35s ease,padding .3s ease}
.nav-inner{max-width:1180px;margin:0 auto;padding:22px 5vw;display:flex;align-items:center;justify-content:space-between}
.nav.solid{background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav.solid .nav-inner{padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-style:italic;font-size:1.25rem;color:var(--fg);text-decoration:none}
.brand svg{flex:none}
.navlinks{display:flex;align-items:center;gap:34px}
.navlinks a{text-decoration:none;font-size:.86rem;letter-spacing:.03em;color:var(--fg);opacity:.85;position:relative;padding-block:4px}
.navlinks a:hover{opacity:1}
.navlinks a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
.navlinks a:hover::after{transform:scaleX(1)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 24px;border-radius:2px;font-size:.82rem;letter-spacing:.04em;font-weight:600;text-decoration:none;border:1px solid var(--accent);transition:transform .2s ease,background .2s ease,color .2s ease}
.btn-solid{background:var(--accent);color:#1b1304}
.btn-solid:hover{transform:translateY(-1px);filter:brightness(1.07)}
.btn-ghost{background:transparent;color:inherit;border-color:color-mix(in srgb, var(--fg) 25%, transparent)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-ghost.on-hero{color:#f3efe8;border-color:#f3efe8}
.burger{display:none;background:none;border:0;padding:6px;color:var(--fg)}
@media (max-width:860px){
  .navlinks{display:none}
  .burger{display:flex}
}
.mobile-menu{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:24px 6vw;gap:28px}
.mobile-menu a{font-family:var(--display);font-size:1.6rem;text-decoration:none;color:var(--fg)}
.mobile-close{align-self:flex-end;background:none;border:0;color:var(--fg)}

/* Hero */
.hero{position:relative;min-height:92vh;display:flex;align-items:flex-end;color:#f3efe8;overflow:hidden}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 30%}
.hero-scrim{position:absolute;inset:0;background:linear-gradient(180deg, rgba(10,8,6,.55) 0%, rgba(10,8,6,.35) 40%, rgba(10,8,6,.85) 100%)}
.hero-content{position:relative;z-index:2;padding:0 5vw 9vh;max-width:760px}
.hero-eyebrow{font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;color:#d9a84f;font-weight:600;opacity:0;animation:fadeUp .8s ease .2s forwards}
.hero h1{font-style:italic;font-size:clamp(2.4rem,6vw,4.6rem);line-height:1.08;margin:14px 0 18px;opacity:0;animation:fadeUp .9s ease .4s forwards}
.hero p{font-size:1.1rem;color:#e8e1d4;max-width:34em;opacity:0;animation:fadeUp .9s ease .6s forwards}
.hero-ctas{display:flex;gap:16px;flex-wrap:wrap;margin-top:30px;opacity:0;animation:fadeUp .9s ease .8s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.scrolldown{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:2;color:#f3efe8;opacity:.8;animation:bounce 2.2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}
@media (prefers-reduced-motion: reduce){
  .hero-eyebrow,.hero h1,.hero p,.hero-ctas{animation:none;opacity:1}
  .scrolldown{animation:none}
}

section{padding-block:7.5rem}
.section-head{display:flex;flex-direction:column;gap:14px;margin-bottom:3rem;max-width:620px}
.section-head h2{font-size:clamp(1.9rem,3.6vw,2.6rem);font-style:italic}

/* Portfolio */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:2.6rem}
.chip{padding:9px 18px;border-radius:2px;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:.82rem;letter-spacing:.03em;transition:all .2s ease}
.chip.on,.chip:hover{border-color:var(--accent);color:var(--accent)}
.masonry{columns:3 260px;column-gap:14px}
@media (max-width:700px){.masonry{columns:1}}
.pitem{break-inside:avoid;margin-bottom:14px;position:relative;overflow:hidden;cursor:pointer;background:var(--bg-raised)}
.pitem img{width:100%;transition:transform .6s cubic-bezier(.2,.7,.2,1);display:block}
.pitem:hover img{transform:scale(1.06)}
.poverlay{position:absolute;inset:0;background:linear-gradient(0deg, rgba(10,8,6,.82) 0%, rgba(10,8,6,0) 55%);opacity:0;transition:opacity .3s ease;display:flex;align-items:flex-end;padding:18px;color:#f3efe8}
.pitem:hover .poverlay{opacity:1}
.poverlay .pcat{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:#d9a84f;display:block;margin-bottom:4px}
.poverlay .ptitle{font-family:var(--display);font-style:italic;font-size:1.1rem}

/* Lightbox */
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(8,6,5,.96);display:flex;align-items:center;justify-content:center;padding:4vh 4vw}
.lightbox img{max-height:86vh;max-width:86vw;object-fit:contain;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.lightbox-cap{position:absolute;bottom:4vh;left:0;right:0;text-align:center;color:#f3efe8}
.lightbox-cap .pcat{color:#d9a84f;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase}
.lb-btn{position:absolute;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#f3efe8;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.lb-btn:hover{background:rgba(255,255,255,.18)}
.lb-close{top:env(safe-area-inset-top,22px);right:22px}
.lb-prev{left:16px;top:50%;transform:translateY(-50%)}
.lb-next{right:16px;top:50%;transform:translateY(-50%)}
@media (max-width:700px){.lb-prev,.lb-next{width:38px;height:38px}}

/* Services */
.services-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media (max-width:760px){.services-grid{grid-template-columns:1fr}}
.svc-card{background:var(--bg-raised);border:1px solid var(--line);display:flex;flex-direction:column}
.svc-img{height:200px;background-size:cover;background-position:center;position:relative}
.svc-badge{position:absolute;top:16px;left:16px;background:var(--bg);color:var(--fg);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px}
.svc-body{padding:28px}
.svc-body h3{font-size:1.4rem;font-style:italic}
.svc-price{font-family:var(--display);font-size:2rem;color:var(--accent);margin:10px 0 18px}
.svc-price span{font-size:.9rem;color:var(--mut);font-family:var(--body)}
.svc-feats{list-style:none;margin:0 0 24px;padding:0;display:flex;flex-direction:column;gap:10px}
.svc-feats li{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;color:var(--mut)}
.svc-feats svg{flex:none;margin-top:3px;color:var(--accent)}
.svc-cta{width:100%;text-align:center;padding:13px;background:transparent;border:1px solid var(--fg);color:var(--fg);font-size:.82rem;letter-spacing:.04em;font-weight:600;transition:all .2s ease}
.svc-cta:hover{background:var(--fg);color:var(--bg)}

/* About */
.about-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:64px;align-items:center}
@media (max-width:860px){.about-grid{grid-template-columns:1fr}}
.about-imgs{position:relative;min-height:420px}
.about-imgs img{position:absolute;object-fit:cover}
.about-img1{width:72%;height:360px;top:0;left:0;filter:grayscale(.15) sepia(.08)}
.about-img2{width:58%;height:260px;bottom:0;right:0;border:8px solid var(--bg)}
.about-badge{position:absolute;top:30%;right:-14px;background:var(--accent);color:#1b1304;width:112px;height:112px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--display);font-style:italic;font-size:.85rem;line-height:1.25;padding:8px;z-index:2;box-shadow:0 14px 30px rgba(0,0,0,.25)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:40px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat b{display:block;font-family:var(--display);font-size:2.1rem;color:var(--accent)}
.stat span{font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}

/* Testimonials */
.dark-section{background:var(--dark-bg);color:var(--dark-fg)}
.dark-section .eyebrow{color:#d9a84f}
.dark-section .lede{color:#b8b0a2}
.test-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
@media (max-width:760px){.test-grid{grid-template-columns:1fr}}
.test-card{background:#1a1715;border:1px solid #2d2823;padding:30px}
.test-quote{color:#d9a84f;opacity:.5;margin-bottom:10px}
.test-stars{color:#d9a84f;letter-spacing:2px;margin-bottom:14px;font-size:.9rem}
.test-text{font-size:1rem;color:#e8e1d4;margin-bottom:20px}
.test-who{display:flex;flex-direction:column}
.test-who b{font-family:var(--display);font-style:italic;font-size:1.05rem}
.test-who span{font-size:.78rem;color:#a79e91}

/* Contact */
.contact-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px}
@media (max-width:860px){.contact-grid{grid-template-columns:1fr}}
.info-card{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
.info-card svg{flex:none;color:var(--accent);margin-top:2px}
.info-card b{display:block;font-size:.95rem}
.info-card span{color:var(--mut);font-size:.88rem}
.form-row{display:flex;gap:16px;flex-wrap:wrap}
.field{flex:1;min-width:200px;display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.field label{font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.field input,.field select,.field textarea{background:var(--bg-raised);border:1px solid var(--line);padding:12px 14px;font:inherit;color:var(--fg);border-radius:2px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.submit-btn{padding:14px 30px;background:var(--accent);color:#1b1304;border:0;font-weight:600;letter-spacing:.04em;font-size:.86rem;border-radius:2px}
.submit-btn:disabled{opacity:.6;cursor:default}
.success-box{border:1px solid var(--accent);background:var(--accent-soft);padding:24px;display:flex;gap:14px;align-items:flex-start}
.success-box svg{flex:none;color:var(--accent);margin-top:2px}
.form-note{font-size:.8rem;color:var(--mut);margin-top:10px}

/* Footer */
footer{border-top:1px solid var(--line);padding-block:3.5rem}
.foot-grid{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:24px}
.foot-links{display:flex;gap:26px;flex-wrap:wrap}
.foot-links a{text-decoration:none;color:var(--mut);font-size:.85rem}
.foot-links a:hover{color:var(--accent)}
.foot-social{display:flex;gap:14px}
.foot-social a{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--fg);text-decoration:none}
.foot-social a:hover{border-color:var(--accent);color:var(--accent)}
.foot-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:34px;padding-top:24px;border-top:1px solid var(--line);font-size:.78rem;color:var(--mut);flex-wrap:wrap;gap:14px}
.totop{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--mut);font-size:.78rem}
.totop:hover{color:var(--accent)}

.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* FAQ */
.faq{max-width:760px}
.faq details{border-bottom:1px solid var(--line);padding:18px 0}
.faq summary{cursor:pointer;font-family:var(--display);font-style:italic;font-size:1.15rem;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::after{content:"+";color:var(--accent);font-style:normal}
.faq details[open] summary::after{content:"–"}
.faq p{color:var(--mut);margin:12px 0 0}
/* Inbox */
.inbox{border:1px solid var(--line);background:var(--bg-raised);padding:24px;margin-top:2.5rem}
.inbox h3{font-size:1.2rem;font-style:italic;margin-bottom:12px}
.inbox-row{padding:14px 0;border-top:1px solid var(--line);font-size:.9rem}
.inbox-row b{font-family:var(--display);font-style:italic}
.inbox-row span{color:var(--mut)}

/* Admin */
.adm{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;padding:max(20px,env(safe-area-inset-top,0px)) 5vw 60px}
.adm-in{max-width:980px;margin:0 auto}
.adm-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.adm-card{border:1px solid var(--line);background:var(--bg-raised);padding:18px;margin-bottom:14px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.adm-card .thumb{width:110px;height:84px;object-fit:cover;background:var(--line)}
.adm-card .col{flex:1;min-width:220px}
.adm .field{margin-bottom:12px}
.adm-btn{padding:9px 16px;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:.8rem;border-radius:2px}
.adm-btn.pri{background:var(--accent);color:#1b1304;border-color:var(--accent);font-weight:600}
.adm-btn.del{color:#c0392b;border-color:#c0392b}
.adm-msg{padding:10px 14px;border:1px solid var(--accent);background:var(--accent-soft);margin-bottom:14px;font-size:.88rem}
.adm-login{max-width:400px;margin:12vh auto 0}
</style>

</head><body>
<div id="root"></div>

/* ---------- Portfolio ---------- */
function Portfolio(){
  const {cfg}=useSite(); const PORTFOLIO=cfg.portfolio; const CATS=["All",...Array.from(new Set(PORTFOLIO.map(p=>p.cat)))];
  const [filter,setFilter] = useState("All");
  const [lightbox,setLightbox] = useState(null); // index into filtered list
  const items = filter==="All" ? PORTFOLIO : PORTFOLIO.filter(p=>p.cat===filter);

  const close = useCallback(()=>setLightbox(null),[]);
  const next = useCallback(()=>setLightbox(i=> i===null?null:(i+1)%items.length),[items.length]);
  const prev = useCallback(()=>setLightbox(i=> i===null?null:(i-1+items.length)%items.length),[items.length]);

  useEffect(()=>{
    if(lightbox===null) return;
    const onKey = (e)=>{
      if(e.key==="Escape") close();
      if(e.key==="ArrowRight") next();
      if(e.key==="ArrowLeft") prev();
    };
    window.addEventListener("keydown", onKey);
    return ()=> window.removeEventListener("keydown", onKey);
  },[lightbox,close,next,prev]);

  return (
    <section id="work" className="wrap">
      <div className="section-head">
        <div className="eyebrow">Selected Work</div>
        <h2>A Portfolio of Honest Moments</h2>
        <p className="lede">A survey of weddings, portraits, family sessions, and the landscapes that surround them.</p>
      </div>
      <div className="filters" role="tablist" aria-label="Filter portfolio">
        {CATS.map(c=>(
          <button key={c} role="tab" aria-selected={filter===c} className={"chip"+(filter===c?" on":"")} onClick={()=>setFilter(c)}>{c}</button>
        ))}
      </div>
      <div className="masonry">
        {items.map((p,i)=>(
          <figure className="pitem" key={p.id} onClick={()=>setLightbox(i)} style={{aspectRatio:1/p.h}}>
            <img src={imgSrc(p.url)} alt={p.title} loading="lazy" style={{height:"100%",objectFit:"cover"}}/>
            <div className="poverlay">
              <div>
                <span className="pcat">{p.cat}</span>
                <span className="ptitle">{p.title}</span>
              </div>
            </div>
          </figure>
        ))}
      </div>

      {lightbox!==null && (
        <div className="lightbox" role="dialog" aria-modal="true" onClick={close}>
          <button className="lb-btn lb-close" aria-label="Close" onClick={e=>{e.stopPropagation();close();}}><Close/></button>
          <button className="lb-btn lb-prev" aria-label="Previous image" onClick={e=>{e.stopPropagation();prev();}}>{Chevron("l")}</button>
          <img src={imgSrc(items[lightbox].url)} alt={items[lightbox].title} onClick={e=>e.stopPropagation()}/>
          <button className="lb-btn lb-next" aria-label="Next image" onClick={e=>{e.stopPropagation();next();}}>{Chevron("r")}</button>
          <div className="lightbox-cap">
            <span className="pcat">{items[lightbox].cat}</span><br/>
            <span className="ptitle" style={{fontFamily:"var(--display)",fontStyle:"italic"}}>{items[lightbox].title}</span>
          </div>
        </div>
      )}
    </section>
  );
}

/* ---------- Contact ---------- */
function Contact({presetService}){
  const {cfg}=useSite(); const SERVICES=cfg.services;
  const [form,setForm] = useState({name:"",email:"",service:"",date:"",message:""});
  const [status,setStatus] = useState("idle"); // idle | sending | ok | nodb
  const [db,setDb] = useState(undefined); // undefined=loading, null=unavailable

  useEffect(()=>{
    let cancelled=false;
    (async ()=>{
      try{
        const d = await window.claude?.use?.("db");
        if(!cancelled) setDb(d ?? null);
      }catch(e){ if(!cancelled) setDb(null); }
    })();
    return ()=>{cancelled=true;};
  },[]);

  useEffect(()=>{
    if(presetService) setForm(f=>({...f, service:presetService}));
  },[presetService]);

  const field = (k)=> ({
    value: form[k],
    onChange: (e)=> setForm(f=>({...f,[k]:e.target.value}))
  });

  const submit = async (e)=>{
    e.preventDefault();
    setStatus("sending");
    const payload = {...form, createdAt: Date.now()};
    try{
      if(db){
        await db.collection("booking_inquiries").add(payload);
        setStatus("ok");
      } else {
        setStatus("nodb");
      }
    }catch(err){
      setStatus("nodb");
    }
  };

  if(status==="ok"){
    return (
      <div className="success-box" role="status">
        <Check size={22}/>
        <div>
          <b>Inquiry received.</b>
          <p className="lede" style={{margin:"6px 0 0"}}>Thank you, {form.name.split(" ")[0]||"friend"} — we reply to every inquiry within two business days. We'll follow up at {form.email}.</p>
        </div>
      </div>
    );
  }

  if(status==="nodb"){
    return (
      <div className="success-box" role="status">
        <Mail size={22}/>
        <div>
          <b>We couldn't save this automatically here.</b>
          <p className="lede" style={{margin:"6px 0 10px"}}>Please reach us directly and we'll get right back to you — this page couldn't connect to the inquiry log just now.</p>
          <p style={{margin:0,fontSize:".9rem"}}>{cfg.email} · {cfg.phone}</p>
        </div>
      </div>
    );
  }

  return (
    <form onSubmit={submit}>
      <div className="form-row">
        <div className="field">
          <label htmlFor="f-name">Name</label>
          <input id="f-name" required placeholder="Your full name" {...field("name")}/>
        </div>
        <div className="field">
          <label htmlFor="f-email">Email</label>
          <input id="f-email" type="email" required placeholder="you@email.com" {...field("email")}/>
        </div>
      </div>
      <div className="form-row">
        <div className="field">
          <label htmlFor="f-service">Service type</label>
          <select id="f-service" required {...field("service")}>
            <option value="">Select a service</option>
            {SERVICES.map(s=> <option key={s.id} value={s.name}>{s.name}</option>)}
            <option value="Other">Other / not sure yet</option>
          </select>
        </div>
        <div className="field">
          <label htmlFor="f-date">Preferred date</label>
          <input id="f-date" type="date" {...field("date")}/>
        </div>
      </div>
      <div className="field">
        <label htmlFor="f-msg">Message</label>
        <textarea id="f-msg" rows="4" placeholder="Tell us about the occasion, location, and anything we should know." {...field("message")}></textarea>
      </div>
      <button className="submit-btn" disabled={status==="sending" || db===undefined}>
        {status==="sending" ? "Sending…" : "Send Inquiry"}
      </button>
      <p className="form-note">We typically reply within two business days.</p>
    </form>
  );
}

/* ---------- Owner inbox ---------- */
function Inbox(){
  const [rows,setRows]=useState(null);
  useEffect(()=>{
    let off=()=>{};
    (async()=>{
      try{
        const user=await window.claude?.use?.("user");
        if(!(user?.isOwner?.())) return;
        const db=await window.claude?.use?.("db");
        if(!db) return;
        off=db.collection("booking_inquiries").onSnapshot(snap=>{
          const list=[]; snap.forEach(d=>list.push(d.data()));
          list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
          setRows(list);
        });
      }catch(e){}
    })();
    return ()=>{ try{off&&off();}catch(e){} };
  },[]);
  if(!rows) return null;
  return (
    <div className="wrap"><div className="inbox">
      <h3>Inquiries ({rows.length}) — only you see this</h3>
      {rows.length===0 && <p className="lede">No inquiries yet.</p>}
      {rows.map((r,i)=>(
        <div className="inbox-row" key={i}>
          <b>{r.name}</b> · <span>{r.email} · {r.service}{r.date?" · "+r.date:""}</span>
          {r.message && <div>{r.message}</div>}
        </div>
      ))}
    </div></div>
  );
}

/* ---------- App ---------- */
function App(){
  const [cfg,setCfg]=useState(DEFAULT_CFG);
  useEffect(()=>{
    (async()=>{
      try{
        if(/preview/.test(location.search)){ const v=localStorage.getItem("lum_doc_site/config"); if(v){ setCfg({...DEFAULT_CFG,...JSON.parse(v)}); return; } }
        const r=await fetch("config.json",{cache:"no-store"});
        if(r.ok) setCfg({...DEFAULT_CFG,...await r.json()});
      }catch(e){}
    })();
  },[]);
  useEffect(()=>{ document.title=cfg.fullName; },[cfg.fullName]);
  const [presetService,setPresetService] = useState("");
  const pickService = (name)=>{
    setPresetService(name);
    document.getElementById("contact")?.scrollIntoView({behavior:"smooth"});
  };
  return (
    <SiteCtx.Provider value={{cfg}}>
      <Nav/>
      <Hero/>
      <Portfolio/>
      <Services onPick={pickService}/>
      <About/>
      <Testimonials/>
      <ContactSection presetService={presetService}/>
      <FAQ/>
      <Footer/>
    </SiteCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
